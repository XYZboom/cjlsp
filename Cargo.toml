[workspace]
resolver = "2"
members = [
    "crates/cj-lexer",
    "crates/cj-ast",
    "crates/cj-parser",
    "crates/cj-cfg",
    "crates/cj-sema",
    "crates/cj-diag",
    "crates/cj-frontend",
    "crates/cj-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
